# main() only idles, but every SYS_INIT (LVGL init, SD mount) runs on this stack.
# Measured peak 1344 bytes ("kernel thread stacks"), keep about 2x margin
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y
# -O2: LVGL software rendering and JPEG decoding are CPU bound, flash has plenty of room
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_SHELL=y
# Measured 1504 / 2048 bytes, too close
CONFIG_SHELL_STACK_SIZE=3072
# Logs reach the console through the shell, which has its own queue. INFO stays on during
# development (lower the levels for a release build) and the boot burst overflowed the default
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_SPI=y
# With DMA, transfers wait on an interrupt instead of busy polling, so other threads keep running
CONFIG_SPI_ESP32_INTERRUPT=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_MKFS=y
# CONFIG_FILE_SYSTEM_SHELL_MOUNT_COMMAND=y

CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_FS_FATFS_LFN=y
# Don't format the card automatically when mount fails (e.g. an exFAT card),
# use "fs mkfs" from the shell instead
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_DRAW_SW_COMPLEX=y
# CONFIG_LV_USE_FS_FATFS=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_48=y
# JPEG decoding uses the project copy in src/lib/tjpgd (RGB565 output, fastest mode)

# Menu stays alive under every app, and Files with ~20 rows plus the fade-in (both screens drawn)
# ran 32 KB out of memory. The RAM left over for the unused libc heap covers the increase.
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# Draw buffer as % of the screen, larger means fewer flushes per frame
CONFIG_LV_Z_VDB_SIZE=20
# Must match LV_COLOR_DEPTH, otherwise the draw buffer is allocated twice as large
CONFIG_LV_Z_BITS_PER_PIXEL=16
# Render the next part while the previous one is sent to the display
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_DOUBLE_VDB=y
# CONFIG_LV_Z_LVGL_MUTEX=y
CONFIG_LV_Z_USE_FILESYSTEM=y

CONFIG_LED=y
CONFIG_LED_GPIO=y

CONFIG_SENSOR=y
CONFIG_MPU6050=y

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_I2S=y

# Hardware RNG for the Dice app
CONFIG_ENTROPY_GENERATOR=y

# Settings kept across reboots (storage partition in flash)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

####
# CONFIG_SMP=y
# CONFIG_MP_MAX_NUM_CPUS=2

#### Debug: "kernel thread stacks" in the shell shows stack usage
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
# Used by the SysInfo app
CONFIG_THREAD_MONITOR=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

####
# CONFIG_APP_THREAD_SHOW_FPS=y
CONFIG_APP_MENU=y
# Measured peak 688 bytes
CONFIG_INPUT_THREAD_STACK_SIZE=2048
